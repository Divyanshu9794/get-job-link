<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Immediate Canonical Domain Redirect: Redirects *.web.app and *.firebaseapp.com to custom domain getjoblink.in -->
    <script>
      (function() {
        var h = window.location.hostname;
        if (h === 'get-job-link.web.app' || h === 'get-job-link.firebaseapp.com') {
          window.location.replace('https://getjoblink.in' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>GetJobLink | Clean Daily Tech Jobs & Verified Career Portals</title>
    <meta name="description" content="Verified daily tech jobs across India and worldwide. 100% direct company application links with free ATS resume score evaluations and role-specific career guides." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://getjoblink.in/" />
    <!-- Google AdSense Official Script & Publisher Meta -->
    <meta name="google-adsense-account" content="ca-pub-6002861264084272" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6002861264084272" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <!-- Prevent theme flash on page load -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('getjoblink_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
