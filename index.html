
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Get Job Link | Clean Daily Tech Jobs</title>

    <link rel="icon" type="image/png" href="/logo.jpeg" />

    <meta
      name="google-adsense-account"
      content="ca-pub-6002861264084272"
    />

    <!-- Redirect old Firebase domain to the custom domain -->
    <script>
      (function () {
        const hostname = window.location.hostname;

        if (
          hostname === "get-job-link.web.app" ||
          hostname === "www.get-job-link.web.app"
        ) {
          const newUrl =
            "https://getjoblink.in" +
            window.location.pathname +
            window.location.search +
            window.location.hash;

          window.location.replace(newUrl);
        }
      })();
    </script>

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6002861264084272"
      crossorigin="anonymous"
    ></script>

    <!-- Adcash Main Library -->
    <script
      type="text/javascript"
      src="https://acscript.com"
      async
    ></script>

    <!-- Adcash Autotag Initialization -->
    <script type="text/javascript">
      window.addEventListener("DOMContentLoaded", () => {
        const initAclib = () => {
          if (
            typeof aclib !== "undefined" &&
            typeof aclib.runAutoTag === "function"
          ) {
            aclib.runAutoTag({
              zoneId: "mgttqf1elu"
            });
          } else {
            // Retry if the Adcash library has not loaded yet.
            setTimeout(initAclib, 100);
          }
        };

        initAclib();
      });
    </script>
  </head>
